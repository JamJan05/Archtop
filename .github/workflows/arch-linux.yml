name: Arch Linux

# Kept separate from ci.yml on purpose: that file must stay byte-identical to
# desktop/desktop so upstream syncs never conflict here.

on:
  push:
    branches:
      - linux-unstable
      - linux-stable
  pull_request:
    branches:
      - linux-unstable
      - linux-stable
  workflow_dispatch:

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git python yarn xorg-server-xvfb namcap \
            gtk3 nss alsa-lib libnotify libsecret
          # Node 24, not Arch's current nodejs: on 26 extract-zip stops after the
          # first zip entry without raising, so Electron unpacks to a single file
          # and the build "succeeds" with an empty app. See packaging/arch/README.md.
          pacman -S --noconfirm --needed nodejs-lts-krypton

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # makepkg refuses to run as root, and the container's default user is root.
      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: su builder -c 'yarn install --frozen-lockfile'

      - name: Lint
        run: su builder -c 'yarn lint'

      - name: Test
        run: su builder -c 'yarn test'

      - name: Build
        run: su builder -c 'yarn build:prod'

      - name: Package
        run: su builder -c 'yarn package'

      - name: Smoke test the packaged binary
        run: |
          su builder -c 'xvfb-run -a ./dist/desktop-linux-x64/desktop --version' \
            || echo '::warning::packaged binary did not report a version'

      - name: Check the PKGBUILD
        run: |
          su builder -c 'bash -n packaging/arch/PKGBUILD'
          su builder -c 'cd packaging/arch && makepkg --printsrcinfo > /tmp/srcinfo.generated'
          diff -u packaging/arch/.SRCINFO /tmp/srcinfo.generated \
            || { echo '::error::.SRCINFO is stale; run makepkg --printsrcinfo'; exit 1; }
          su builder -c 'cd packaging/arch && namcap PKGBUILD'

      - uses: actions/upload-artifact@v4
        with:
          name: github-desktop-archtop-linux-x64
          path: dist/*.tar.gz
          retention-days: 7
